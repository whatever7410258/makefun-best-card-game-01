<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Pact — a duel of flame, tide, thorn and gale</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #150d08; }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; cursor: pointer; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Ember Pact: a card duel. Play cards with ember, wake resonances, bring the Warden's life to zero."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
